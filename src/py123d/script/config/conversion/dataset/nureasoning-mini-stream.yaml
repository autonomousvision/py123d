parser:
  _target_: py123d.parser.nureasoning.nureasoning_parser.NureasoningParser
  _convert_: 'all'

  splits: ["nureasoning-mini_train"]

  # Ignored when `downloader` is set — clips are materialized into a managed temp dir.
  nureasoning_data_root: null

  downloader:
    _target_: py123d.parser.nureasoning.nureasoning_download.NureasoningDownloader
    _convert_: 'all'

    # Not used in streaming — the parser assigns a tempfile.TemporaryDirectory as output_dir.
    output_dir: null

    revision: main
    hf_token: null              # falls back to $HF_TOKEN / $HUGGINGFACE_HUB_TOKEN (repo is public)

    # Keep the downloader's split/part selection aligned with the parser's splits above:
    # the mini subset is parts 1-3 of the HF "train" split.
    splits: ["train"]
    parts: ["part_1", "part_2", "part_3"]

    # Selection — mutually exclusive. When neither is set, all clips in the selection are streamed.
    log_names: null
    num_logs: null
    sample_random: false
    seed: 0

    max_workers: 8
    keep_zip: false
    dry_run: false

log_writer_config:
  _target_: py123d.api.scene.arrow.utils.log_writer_config.LogWriterConfig
  _convert_: 'all'

  force_log_conversion: ${force_log_conversion}
  force_map_conversion: ${force_map_conversion}
  async_conversion: ${async_conversion}

  # Streaming forces self-contained payloads. Do NOT switch to "path" — the temp dir is
  # deleted after conversion, which would leave the Arrow logs pointing at vanished files.
  camera_store_option: "jpeg_binary"  # "jpeg_binary", "png_binary" — "path" forbidden here
  # NOTE: raw "binary" preserves nuReasoning's merged-lidar features (lidar_info / ring / intensity).
  # Only switch to a codec (e.g. "laz") once confirmed lossless for these extra channels.
  lidar_store_option: "binary"        # "binary" — "path" forbidden here
  lidar_codec: "laz"                   # None or "laz", "draco", "ipc_zstd", "ipc_lz4", "ipc"

  infer_ego_dynamics: false
  infer_box_dynamics: false

log_writer:
  _target_: py123d.api.scene.arrow.arrow_log_writer.ArrowLogWriter
  _convert_: 'all'
  log_writer_config: ${dataset.log_writer_config}
  logs_root: ${dataset_paths.py123d_logs_root}
  sensors_root: ${dataset_paths.py123d_sensors_root}
  ipc_compression: null
  ipc_compression_level: null

  sync_config:
    _target_: py123d.api.scene.arrow.arrow_log_writer.SyncConfig
    _convert_: 'all'

    # The box detections are emitted on every frame, so they are a robust sync reference even when
    # some modalities (e.g. lidar) are absent in a given log.
    reference_column: box_detections_se3.timestamp_us
    direction: "forward" # "forward" or "backward"
    # nuReasoning frames are already at 10Hz.
    target_iteration_duration_s: 0.1

# nuReasoning maps are per-log: NureasoningParser.get_map_parsers() yields one NureasoningMapParser per
# clip, and this writer stores each clip's map at {logs_root}/{split}/{log_name}/map.arrow.
map_writer:
  _target_: py123d.api.map.arrow.arrow_map_writer.ArrowMapWriter
  _convert_: 'all'
  force_map_conversion: ${force_map_conversion}
  maps_root: ${dataset_paths.py123d_maps_root}
  logs_root: ${dataset_paths.py123d_logs_root}
